[package]
name = "silly-easychar"
version = "0.2.7"
description = "Offline SillyTavern character card studio"
authors = ["Silly EasyChar contributors"]
edition = "2021"

[lib]
name = "silly_easychar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
base64 = "0.22"
sha2 = "0.10"

